spring.application.name=atendimento-sus

# ---------- Datasource (PostgreSQL) ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atendimento_sus}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
# Flyway é o dono do schema; Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway ----------
spring.flyway.enabled=true

# ---------- Segurança / JWT ----------
app.security.jwt.secret=${JWT_SECRET:troque-esta-chave-em-producao-com-no-minimo-32-bytes!!}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---------- IA / Ollama (assistência à triagem — best-effort) ----------
app.ai.ollama.enabled=${APP_AI_ENABLED:true}
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:llama3.2:3b}
app.ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:60}

# ---------- OpenAPI / Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
