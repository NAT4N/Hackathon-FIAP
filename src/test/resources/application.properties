# Perfil de teste — datasource é fornecido pelo Testcontainers (@ServiceConnection).
# Segredo JWT fixo para tornar os testes determinísticos.
app.security.jwt.secret=segredo-de-teste-com-no-minimo-32-bytes-para-hs256!!
app.security.jwt.expiration-minutes=60

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
logging.level.org.springframework.security=WARN

# IA desligada nos testes → usa o adapter no-op (suíte roda sem Ollama).
app.ai.ollama.enabled=false
